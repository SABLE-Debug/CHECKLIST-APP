<script>
// ── STORAGE ──────────────────────────────────────────
const STORE  = 'akhara_lists_v3';
const TSTORE = 'akhara_templates_v1';
const RSTORE = 'akhara_last_reset';

let lists     = JSON.parse(localStorage.getItem(STORE)  || '[]');
let templates = JSON.parse(localStorage.getItem(TSTORE) || '[]');
let currentId  = null;
let itemFilter = 'all';
let addType    = 'simple';
let renameId   = null;
let prevPct    = {};

function save()  { localStorage.setItem(STORE,  JSON.stringify(lists));     }
function saveT() { localStorage.setItem(TSTORE, JSON.stringify(templates)); }
function getList(id) { return lists.find(function(l){ return l.id === id; }); }

// ── DAILY RESET (SAST = UTC+2) ───────────────────────
function getSASTDateStr() {
  var now  = new Date();
  var sast = new Date(now.getTime() + (2 * 60 * 60 * 1000));
  return sast.toISOString().slice(0, 10); // YYYY-MM-DD
}

function runDailyReset() {
  var today     = getSASTDateStr();
  var lastReset = localStorage.getItem(RSTORE) || '';
  if (lastReset === today) return; // Already reset today — nothing to do

  var didReset = lists.length > 0;

  lists.forEach(function(l) {
    if (l.templateId) {
      // List was created from a template — restore ONLY template items (wipes unsaved additions)
      var tpl = templates.find(function(t){ return t.id === l.templateId; });
      if (tpl) {
        l.items = tpl.items.map(function(i) {
          return {
            id:      Date.now() + Math.random(),
            type:    i.type    || 'simple',
            text:    i.text,
            done:    false,
            current: 0,
            steps:   i.steps  || 0
          };
        });
      } else {
        // Template was deleted — just reset completions, keep current items
        l.items.forEach(function(i){ i.done = false; i.current = 0; });
      }
    } else {
      // Regular list — reset completions only
      l.items.forEach(function(i){ i.done = false; i.current = 0; });
    }
  });

  localStorage.setItem(RSTORE, today);
  save();
  return didReset;
}

function updateCountdown() {
  var el = document.getElementById('countdown-timer');
  if (!el) return;
  var now  = new Date();
  // Next midnight in SAST (UTC+2)
  var sast = new Date(now.getTime() + 2 * 60 * 60 * 1000);
  var nextMidnight = new Date(Date.UTC(sast.getUTCFullYear(), sast.getUTCMonth(), sast.getUTCDate() + 1, 0, 0, 0));
  // Convert back: nextMidnight is SAST midnight = UTC midnight - 2h
  var nextMidnightUTC = nextMidnight.getTime() - 2 * 60 * 60 * 1000;
  var diff = nextMidnightUTC - now.getTime();
  if (diff < 0) diff = 0;
  var h = Math.floor(diff / 3600000);
  var m = Math.floor((diff % 3600000) / 60000);
  var s = Math.floor((diff % 60000) / 1000);
  var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
  el.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
  // Turn red when under 1 hour
  if (h < 1) el.classList.add('urgent');
  else el.classList.remove('urgent');
}

// Tick every second
updateCountdown();
setInterval(updateCountdown, 1000);

// Run reset on load
var justReset = runDailyReset();
// Check every minute for midnight crossover
setInterval(function() {
  var reset = runDailyReset();
  if (reset) { renderHome(); }
}, 60000);

// ── LOADER ───────────────────────────────────────────
(function(){
  var p = 0;
  var fill = document.getElementById('lf');
  var iv = setInterval(function() {
    p = Math.min(p + Math.random()*18+4, 98);
    fill.style.width = p + '%';
    if (p >= 98) clearInterval(iv);
  }, 110);
  function done() { fill.style.width='100%'; setTimeout(function(){ document.getElementById('loader').classList.add('hidden'); }, 380); }
  if (document.readyState === 'complete') setTimeout(done, 800);
  else { window.addEventListener('load', function(){ setTimeout(done, 500); }); setTimeout(done, 2200); }
})();

// ── HAPTIC ───────────────────────────────────────────
function haptic(type) {
  type = type || 'light';
  if (!window.navigator || !navigator.vibrate) return;
  var patterns = { light:[10], medium:[20], heavy:[30,10,20], success:[15,10,15,10,40], celebration:[20,10,20,10,20,10,60] };
  navigator.vibrate(patterns[type] || [10]);
}

// ── CELEBRATION ──────────────────────────────────────
function celebrate() {
  haptic('celebration');
  var wrap = document.getElementById('confetti-wrap');
  wrap.innerHTML = '';
  var colors = ['#C9A84C','#FFD060','#FFF0B0','#E8A820','#8B5010','#f5f0e8','#FF9000'];
  for (var i = 0; i < 55; i++) {
    var dot = document.createElement('div');
    dot.className = 'c-dot';
    var size = Math.random()*8+3;
    var x = Math.random()*100, y = Math.random()*60+10;
    var dx = (Math.random()-0.5)*280, dy = -(Math.random()*200+80);
    dot.style.cssText = 'left:'+x+'%;top:'+y+'%;width:'+size+'px;height:'+size+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';--dx:'+dx+'px;--dy:'+dy+'px;animation-delay:'+(Math.random()*0.4)+'s;animation-duration:'+(0.9+Math.random()*0.6)+'s;';
    wrap.appendChild(dot);
  }
  for (var j = 0; j < 8; j++) {
    var ring = document.createElement('div');
    ring.className = 'c-ring';
    var rx = Math.random()*80+10, ry = Math.random()*60+10;
    var rs = Math.random()*30+20;
    ring.style.cssText = 'left:'+rx+'%;top:'+ry+'%;width:'+rs+'px;height:'+rs+'px;border-color:'+colors[Math.floor(Math.random()*colors.length)]+';animation-delay:'+(Math.random()*0.3)+'s;';
    wrap.appendChild(ring);
  }
  var ct = document.getElementById('celeb-text');
  var msgs = ['ARENA CONQUERED','ALL DONE','LOCKED IN','FULL SEND','EXECUTED'];
  ct.textContent = msgs[Math.floor(Math.random()*msgs.length)];
  ct.classList.remove('show');
  void ct.offsetWidth;
  ct.classList.add('show');
  setTimeout(function(){ wrap.innerHTML = ''; ct.classList.remove('show'); }, 2500);
}

// ── RENDER HOME ──────────────────────────────────────
function renderHome() {
  var scroll = document.getElementById('lists-scroll');
  var count  = document.getElementById('home-count');
  var sorted = lists.slice().sort(function(a,b){ return (b.pinned?1:0)-(a.pinned?1:0); });
  count.textContent = lists.length + ' LIST' + (lists.length!==1?'S':'');

  if (!lists.length) {
    scroll.innerHTML = '<div class="empty-state"><svg class="empty-mark" viewBox="0 0 512 560" fill="none"><circle cx="256" cy="272" r="168" fill="none" stroke="#C9A84C" stroke-width="1.6"/><circle cx="256" cy="272" r="108" fill="none" stroke="#C9A84C" stroke-width="1.2"/><line x1="256" y1="88" x2="256" y2="480" stroke="#C9A84C" stroke-width="1.4"/><line x1="64" y1="272" x2="448" y2="272" stroke="#C9A84C" stroke-width="1.2"/><circle cx="256" cy="96" r="9" fill="#C9A84C"/></svg><div class="empty-title">The arena is empty.</div><div class="empty-sub">FILL IT.</div></div>';
    return;
  }

  scroll.innerHTML = sorted.map(function(l) {
    var total = l.items.length;
    var done  = l.items.filter(function(i){ return isDone(i); }).length;
    var pct   = total ? Math.round((done/total)*100) : 0;
    var badge = l.pinned
      ? '<div class="pin-badge">PINNED</div>'
      : (l.templateId ? '<div class="tpl-badge">TPL</div>' : '');
    return '<div class="list-card-wrap" id="wrap-'+l.id+'"><div class="swipe-delete-bg">&#128465;</div><div class="list-card'+(l.pinned?' pinned':'')+'" id="card-'+l.id+'" onclick="openList(\''+l.id+'\')">'
      + badge
      + '<div class="card-top"><div class="card-name">'+l.name+'</div><div class="card-actions">'
      + '<button class="card-act-btn" onclick="togglePin(event,\''+l.id+'\')" title="Pin">'+(l.pinned?'★':'☆')+'</button>'
      + '<button class="card-act-btn" onclick="startRename(event,\''+l.id+'\')">&#9998;</button>'
      + '<button class="card-act-btn" onclick="deleteList(event,\''+l.id+'\')">&#10005;</button>'
      + '</div></div>'
      + '<div class="card-meta"><div class="card-progress-bar"><div class="card-progress-fill" style="width:'+pct+'%"></div></div><div class="card-pct">'+pct+'%</div></div>'
      + '<div class="card-counts"><span class="count-pill cp-done">'+done+' DONE</span><span class="count-pill cp-open">'+(total-done)+' LEFT</span></div>'
      + '</div></div>';
  }).join('');

  sorted.forEach(function(l){ attachSwipe(l.id); });
}

// ── SWIPE TO DELETE LIST ──────────────────────────────
function attachSwipe(listId) {
  var card = document.getElementById('card-'+listId);
  if (!card) return;
  var startX=0, startY=0, dragging=false, swiped=false;
  card.addEventListener('touchstart', function(e){
    startX=e.touches[0].clientX; startY=e.touches[0].clientY; dragging=true; swiped=false;
  }, {passive:true});
  card.addEventListener('touchmove', function(e){
    if (!dragging) return;
    var dx = e.touches[0].clientX - startX;
    var dy = Math.abs(e.touches[0].clientY - startY);
    if (dy > 20) { dragging=false; card.style.transform=''; return; }
    if (dx < 0) {
      var tx = Math.max(dx, -90);
      card.style.transform = 'translateX('+tx+'px)';
      if (tx <= -80) swiped = true;
    }
  }, {passive:true});
  card.addEventListener('touchend', function(){
    dragging = false;
    if (swiped) {
      card.style.transform = 'translateX(-100%)';
      card.style.transition = 'transform 0.25s ease';
      setTimeout(function(){ deleteList({stopPropagation:function(){}}, listId, true); }, 220);
    } else {
      card.style.transform = '';
    }
  });
}

// ── LIST ACTIONS ─────────────────────────────────────
function togglePin(e, id) {
  e.stopPropagation();
  var l = getList(id); if (!l) return;
  l.pinned = !l.pinned;
  haptic('light'); save(); renderHome();
}
function deleteList(e, id, skipConfirm) {
  e.stopPropagation();
  var l = getList(id); if (!l) return;
  if (!skipConfirm && !confirm('Delete "'+l.name+'"?')) return;
  lists = lists.filter(function(x){ return x.id!==id; });
  haptic('medium'); save(); renderHome();
}
function startRename(e, id) {
  e.stopPropagation(); renameId=id;
  var l=getList(id); if(!l) return;
  document.getElementById('rename-input').value = l.name;
  openModal('rename-modal');
  setTimeout(function(){ document.getElementById('rename-input').focus(); }, 120);
}
function confirmRename() {
  var val = document.getElementById('rename-input').value.trim().toUpperCase();
  if (!val || !renameId) return;
  var l=getList(renameId); if(l){ l.name=val; save(); renderHome(); }
  closeModal('rename-modal'); renameId=null;
}

// ── OPEN LIST ────────────────────────────────────────
function openList(id) {
  currentId=id; itemFilter='all'; addType='simple';
  document.getElementById('add-type-toggle').textContent='SIMPLE';
  var l=getList(id); if(!l) return;
  document.getElementById('detail-title').textContent=l.name;
  document.getElementById('fab').style.display='none';
  prevPct[id] = calcPct(l);
  setFilter('all',false);
  showView('view-detail'); updateDetailStats();
  setTimeout(function(){ document.getElementById('add-input').focus(); },300);
}
function goHome() {
  save(); document.getElementById('fab').style.display='flex';
  showView('view-home'); renderHome();
}
function showView(id) {
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

// ── ITEM HELPERS ─────────────────────────────────────
function isDone(item) {
  if (item.type==='simple') return item.done;
  return item.current >= item.steps;
}
function calcPct(l) {
  if (!l.items.length) return 0;
  return Math.round((l.items.filter(function(i){ return isDone(i); }).length / l.items.length)*100);
}

// ── RENDER ITEMS ─────────────────────────────────────
function renderItems() {
  var l=getList(currentId); if(!l) return;
  var scroll=document.getElementById('items-scroll');
  var items = l.items.slice();
  if (itemFilter==='open') items=items.filter(function(i){ return !isDone(i); });
  if (itemFilter==='done') items=items.filter(function(i){ return isDone(i); });
  if (!items.length) {
    scroll.innerHTML='<div class="empty-state" style="height:45%"><div class="empty-title" style="font-size:17px">'+(itemFilter==='done'?'Nothing done yet':'All clear')+'</div></div><div class="swipe-hint">SWIPE LEFT TO DELETE ITEM</div>';
    return;
  }
  scroll.innerHTML = items.map(function(item) {
    var realIdx = l.items.indexOf(item);
    if (item.type==='simple') {
      return '<div class="check-item'+(isDone(item)?' done':'')+'" id="si-'+realIdx+'" onclick="toggleSimple('+realIdx+')">'
        +'<div class="checkbox"><span class="checkbox-tick">&#10003;</span></div>'
        +'<div class="item-text-wrap"><div class="item-text">'+esc(item.text)+'</div></div>'
        +'</div>';
    } else {
      var bars = '';
      for (var b=0; b<item.steps; b++) {
        bars += '<div class="interval-step'+(b<item.current?' filled':'')+'" onclick="stepInterval(event,'+realIdx+','+(b+1)+')"></div>';
      }
      return '<div class="interval-item'+(isDone(item)?' done':'')+'" id="ii-'+realIdx+'">'
        +'<div class="interval-track">'
        +'<div class="interval-label">'+esc(item.text)+'</div>'
        +'<div class="interval-bar">'+bars+'</div>'
        +'</div>'
        +'<div class="interval-count">'+item.current+'/'+item.steps+'</div>'
        +'</div>';
    }
  }).join('') + '<div class="swipe-hint">SWIPE LEFT TO DELETE ITEM</div>';

  items.forEach(function(item) {
    var realIdx = l.items.indexOf(item);
    attachItemSwipe(realIdx);
  });
}

function attachItemSwipe(idx) {
  var el = document.getElementById('si-'+idx) || document.getElementById('ii-'+idx);
  if (!el) return;
  var sx=0,sy=0,drag=false,swiped=false;
  el.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; drag=true; swiped=false; },{passive:true});
  el.addEventListener('touchmove',function(e){
    if(!drag)return;
    var dx=e.touches[0].clientX-sx;
    var dy=Math.abs(e.touches[0].clientY-sy);
    if(dy>20){drag=false;el.style.transform='';return;}
    if(dx<0){el.style.transform='translateX('+Math.max(dx,-80)+'px)';if(dx<=-70)swiped=true;}
  },{passive:true});
  el.addEventListener('touchend',function(){
    drag=false;
    if(swiped){el.style.transform='translateX(-100%)';el.style.transition='transform 0.2s';setTimeout(function(){ deleteItem(idx); },180);}
    else el.style.transform='';
  });
}

function deleteItem(idx) {
  var l=getList(currentId); if(!l) return;
  l.items.splice(idx,1);
  haptic('light'); save(); renderItems(); updateDetailStats();
}
function toggleSimple(idx) {
  var l=getList(currentId); if(!l) return;
  l.items[idx].done = !l.items[idx].done;
  haptic(l.items[idx].done?'success':'light');
  save(); renderItems(); updateDetailStats(); checkCelebration();
}
function stepInterval(e, idx, step) {
  e.stopPropagation();
  var l=getList(currentId); if(!l) return;
  var item=l.items[idx]; if(!item) return;
  if (item.current===step) item.current=step-1;
  else item.current=step;
  haptic(isDone(item)?'success':'light');
  save(); renderItems(); updateDetailStats(); checkCelebration();
}
function checkCelebration() {
  var l=getList(currentId); if(!l||!l.items.length) return;
  var pct=calcPct(l);
  if (pct===100 && (prevPct[currentId]||0)<100) celebrate();
  prevPct[currentId]=pct;
}
function updateDetailStats() {
  var l=getList(currentId); if(!l) return;
  var pct=calcPct(l);
  document.getElementById('detail-prog-fill').style.width=pct+'%';
  document.getElementById('detail-pct').textContent=pct+'%';
}

// ── ADD ITEMS ────────────────────────────────────────
function toggleAddType() {
  addType = addType==='simple'?'interval':'simple';
  document.getElementById('add-type-toggle').textContent = addType==='simple'?'SIMPLE':'INTERVAL';
  if (addType==='interval') {
    document.getElementById('interval-label-input').value = document.getElementById('add-input').value;
    openModal('interval-modal');
    setTimeout(function(){ document.getElementById('interval-label-input').focus(); },120);
  }
}

function addItem() {
  var input=document.getElementById('add-input');
  var text=input.value.trim(); if(!text) return;
  if (addType==='interval') {
    document.getElementById('interval-label-input').value=text;
    openModal('interval-modal');
    return;
  }
  var l=getList(currentId); if(!l) return;
  l.items.push({id:Date.now(),type:'simple',text:text,done:false});
  input.value=''; haptic('light');
  save(); renderItems(); updateDetailStats();
  var s=document.getElementById('items-scroll');
  setTimeout(function(){ s.scrollTop=s.scrollHeight; },50);
}

function confirmAddInterval() {
  var text=document.getElementById('interval-label-input').value.trim(); if(!text) return;
  var steps=parseInt(document.getElementById('interval-steps-range').value)||3;
  var l=getList(currentId); if(!l) return;
  l.items.push({id:Date.now(),type:'interval',text:text,steps:steps,current:0});
  document.getElementById('add-input').value='';
  document.getElementById('interval-steps-range').value=3;
  document.getElementById('interval-steps-val').textContent=3;
  addType='simple'; document.getElementById('add-type-toggle').textContent='SIMPLE';
  closeModal('interval-modal'); haptic('light');
  save(); renderItems(); updateDetailStats();
}

function clearDone() {
  var l=getList(currentId); if(!l) return;
  l.items=l.items.filter(function(i){ return !isDone(i); });
  save(); renderItems(); updateDetailStats();
}

function setFilter(f, doRender) {
  if (doRender === undefined) doRender = true;
  itemFilter=f;
  ['all','open','done'].forEach(function(x){
    var b=document.getElementById('tb-'+x);
    if(b) b.classList.toggle('active', x===f);
  });
  if(doRender) renderItems();
}

// ── TEMPLATES ────────────────────────────────────────
function saveAsTemplate() {
  var l=getList(currentId); if(!l||!l.items.length){ alert('Add items first.'); return; }
  var name=prompt('Template name:',l.name); if(!name) return;
  // If list already linked to a template, remove old one and relink
  var tid = Date.now().toString();
  if (l.templateId) {
    templates = templates.filter(function(t){ return t.id !== l.templateId; });
  }
  templates.push({
    id: tid,
    name: name.toUpperCase(),
    items: l.items.map(function(i){
      return { id: Date.now()+Math.random(), type: i.type||'simple', text: i.text, done: false, current: 0, steps: i.steps||0 };
    })
  });
  l.templateId = tid;
  save(); saveT(); haptic('success');
  alert('Template saved! This list will reset to these exact items at midnight SAST.');
}

function openTemplatesModal() {
  renderTemplateGrid(); openModal('templates-modal');
}

function renderTemplateGrid() {
  var grid=document.getElementById('template-grid');
  if (!templates.length) {
    grid.innerHTML='<div style="text-align:center;padding:20px;font-size:10px;letter-spacing:3px;color:rgba(201,168,76,0.3);font-family:\'DM Mono\',monospace;">NO TEMPLATES YET<br><br>OPEN A LIST → SAVE TPL</div>';
    return;
  }
  grid.innerHTML=templates.map(function(t){
    return '<div class="template-row" onclick="createFromTemplate(\''+t.id+'\')"><div class="template-name">'+t.name+'</div><div class="template-count">'+t.items.length+' ITEMS</div><button class="template-del" onclick="deleteTemplate(event,\''+t.id+'\')">&#10005;</button></div>';
  }).join('');
}

function createFromTemplate(tid) {
  var t=templates.find(function(x){ return x.id===tid; }); if(!t) return;
  var newList={
    id: Date.now().toString(),
    name: t.name,
    templateId: tid,
    items: t.items.map(function(i){
      return { id: Date.now()+Math.random(), type: i.type||'simple', text: i.text, done: false, current: 0, steps: i.steps||0 };
    }),
    created: new Date().toLocaleDateString(),
    pinned: false
  };
  lists.push(newList); save();
  closeModal('templates-modal'); renderHome();
  haptic('success');
}

function deleteTemplate(e, tid) {
  e.stopPropagation();
  templates=templates.filter(function(t){ return t.id!==tid; });
  // Unlink any lists pointing to this template
  lists.forEach(function(l){ if(l.templateId===tid) delete l.templateId; });
  save(); saveT(); renderTemplateGrid();
}

// ── NEW LIST ─────────────────────────────────────────
function openNewListModal() {
  openModal('new-list-modal');
  setTimeout(function(){ document.getElementById('new-list-input').focus(); },120);
}

function createList() {
  var val=document.getElementById('new-list-input').value.trim().toUpperCase(); if(!val) return;
  lists.push({id:Date.now().toString(),name:val,items:[],created:new Date().toLocaleDateString(),pinned:false});
  save(); closeModal('new-list-modal');
  document.getElementById('new-list-input').value='';
  renderHome(); haptic('success');
}

// ── MODAL HELPERS ────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(function(o){
  o.addEventListener('click', function(e){ if(e.target===this) closeModal(this.id); });
});

// ── UTILS ────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── INIT ─────────────────────────────────────────────
renderHome();
</script>
